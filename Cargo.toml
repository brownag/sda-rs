[package]
name = "sda-rs"
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Andrew Gene Brown <brown.andrewg@gmail.com>"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
duckdb = { version = "=1.20000.2", features = ["bundled"], optional = true }
polyglot-sql = "0.14"
rusqlite = { version = "0.32", features = ["functions", "hooks", "limits", "load_extension"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[features]
duckdb = ["dep:duckdb"]

[[test]]
name = "duckdb_pipeline_contract"
path = "tests/duckdb_pipeline_contract.rs"
required-features = ["duckdb"]

[[test]]
name = "duckdb_geography_contract"
path = "tests/duckdb_geography_contract.rs"
required-features = ["duckdb"]

[[test]]
name = "duckdb_execution_contract"
path = "tests/duckdb_execution_contract.rs"
required-features = ["duckdb"]

[[test]]
name = "duckdb_security_contract"
path = "tests/duckdb_security_contract.rs"
required-features = ["duckdb"]

[[test]]
name = "duckdb_result_contract"
path = "tests/duckdb_result_contract.rs"
required-features = ["duckdb"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
